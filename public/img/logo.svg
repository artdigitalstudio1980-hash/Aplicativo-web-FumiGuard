<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(12, 10)">
    <!-- Shield background -->
    <path d="M48 0 L96 24 L96 60 C96 84 72 100 48 108 C24 100 0 84 0 60 L0 24 Z"
          fill="url(#shield-grad)"/>
    <!-- Inner shield lighter -->
    <path d="M48 12 L86 32 L86 58 C86 78 68 92 48 98 C28 92 10 78 10 58 L10 32 Z"
          fill="rgba(255,255,255,0.12)"/>
    <!-- Leaf/branch icon inside shield -->
    <g transform="translate(48, 38)" fill="white">
      <!-- Center line -->
      <rect x="-1.5" y="0" width="3" height="30" rx="1.5" fill="white" opacity="0.9"/>
      <!-- Left leaves -->
      <ellipse cx="-3" cy="-8" rx="8" ry="4" transform="rotate(-30, -3, -8)" fill="white" opacity="0.85"/>
      <ellipse cx="-4" cy="8" rx="7" ry="3.5" transform="rotate(-25, -4, 8)" fill="white" opacity="0.75"/>
      <ellipse cx="-5" cy="18" rx="6" ry="3" transform="rotate(-20, -5, 18)" fill="white" opacity="0.65"/>
      <!-- Right leaves -->
      <ellipse cx="3" cy="-8" rx="8" ry="4" transform="rotate(30, 3, -8)" fill="white" opacity="0.85"/>
      <ellipse cx="4" cy="8" rx="7" ry="3.5" transform="rotate(25, 4, 8)" fill="white" opacity="0.75"/>
      <ellipse cx="5" cy="18" rx="6" ry="3" transform="rotate(20, 5, 18)" fill="white" opacity="0.65"/>
    </g>
    <!-- Small check mark bottom -->
    <g transform="translate(48, 84)" fill="white" opacity="0.7">
      <path d="M42 2 L48 10 L58 0" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(120, 18)">
    <!-- FUMI -->
    <text x="0" y="32" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="38"
          fill="url(#text-grad)" letter-spacing="-0.02em">FUMI</text>
    <!-- GUARD with accent on G -->
    <text x="0" y="72" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="38"
          fill="url(#text-grad)" letter-spacing="-0.02em">GUARD</text>
    <!-- Accent dot on the i -->
    <circle cx="130" cy="14" r="5" fill="#059669"/>
    <!-- Tagline -->
    <text x="2" y="92" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11"
          fill="#64748b" letter-spacing="0.3em">GUARDIANES DE TU ESPACIO</text>
  </g>
</svg>
